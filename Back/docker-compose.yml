# Postgres SOLO para desarrollo local. Railway NO usa este fichero:
# en producción la BD es un servicio Postgres gestionado (DATABASE_URL inyectada).
# Local: DATABASE_URL=postgresql://postgres:Admin123.@localhost:5432/portfolio
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123.
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: